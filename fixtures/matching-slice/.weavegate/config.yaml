target:
  db: mysql:8.4
  schema:
    migrations: ../db/migration
    seed: ../db/seed.sql
  sut:
    adapter: gonative
    entrypoint: matching-slice
    variant: vulnerable
scenarios:
  concurrent-assign:
    workers:
      - id: w1
        command: assign
        args:
          request_id: "42"
      - id: w2
        command: assign
        args:
          request_id: "42"
    sync_points:
      - after_read_request
      - before_insert_assignment
oracle:
  assertions:
    - id: active-assignment-is-unique
      sql: |
        SELECT
            project_request_id,
            COUNT(*) AS active_assignment_count
        FROM assignment
        WHERE status = 'ACTIVE'
        GROUP BY project_request_id
        HAVING COUNT(*) > 1
        ORDER BY project_request_id;
      expect_rows: 0
run:
  # 250ms keeps the lock-blocked (fixed variant) replay path fast: the
  # default 3000ms would add 3s to every blocked run (V-005).
  arrive_timeout_ms: 250
