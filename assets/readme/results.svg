  <title id="title">Measured replay, control, and exploration results</title><desc id="desc">Saved schedule replay reproduced 20 of 20 violations in each of three invocations. Controls found zero of 100. Exploration evaluated six candidates in 25.5 seconds and saved candidate index one.</desc>
