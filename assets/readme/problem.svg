<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Turn a database race into replayable evidence</title>
  <desc id="desc">Two workers reach the same read-decide-write path. weavegate controls their sync-points, checks MySQL state with a SQL oracle, and saves a violating schedule with a WG001 verdict.</desc>
  <defs><style>.sans{font-family:'IBM Plex Sans',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#0b6e6a}.title{font-size:31px;font-weight:700;fill:#0d1117}.sub{font-size:15px;fill:#4f5a68}.label{font-size:13px;font-weight:700;fill:#3d4653}.tiny{font-size:12px;fill:#6e7781}.term{font-size:13px;fill:#e8ebee}.termDim{font-size:12px;fill:#8b949e}.termFail{font-size:14px;font-weight:700;fill:#ff7b72}.line{stroke:#d8dde2;stroke-width:1}.flow{stroke:#0f8b86;stroke-width:3;fill:none;marker-end:url(#ta)}.control{stroke:#0969da;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#ba)}</style><marker id="ta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0f8b86"/></marker><marker id="ba" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0969da"/></marker></defs>
  <rect width="1200" height="460" fill="#f8f9fa"/><path d="M0 0h1200v6H0z" fill="#0b6e6a"/><g class="sans"><text class="eyebrow" x="42" y="42">WHY WEAVEGATE</text><text class="title" x="42" y="78">Turn the interleaving into evidence.</text><text class="sub" x="42" y="104">Control the application schedule. Judge the database state. Replay the exact failure.</text></g><line class="line" x1="42" y1="126" x2="1158" y2="126"/>
  <g transform="translate(42 156)"><text class="sans label">APPLICATION WORKFLOW</text><rect y="20" width="390" height="212" rx="5" fill="#fff" stroke="#d8dde2"/><rect y="20" width="4" height="212" fill="#0f8b86"/><text class="mono label" x="24" y="56" fill="#0f8b86">worker A</text><text class="mono label" x="24" y="139" fill="#0969da">worker B</text><line x1="112" y1="51" x2="356" y2="51" stroke="#0f8b86" stroke-width="3"/><line x1="112" y1="134" x2="356" y2="134" stroke="#0969da" stroke-width="3"/><g class="sans tiny" text-anchor="middle"><text x="144" y="79">read</text><text x="234" y="79">decide</text><text x="326" y="79">write</text><text x="144" y="162">read</text><text x="234" y="162">decide</text><text x="326" y="162">write</text></g><g fill="#fff" stroke-width="3"><circle cx="144" cy="51" r="7" stroke="#0f8b86"/><circle cx="234" cy="51" r="7" stroke="#0f8b86"/><circle cx="326" cy="51" r="7" stroke="#0f8b86"/><circle cx="144" cy="134" r="7" stroke="#0969da"/><circle cx="234" cy="134" r="7" stroke="#0969da"/><circle cx="326" cy="134" r="7" stroke="#0969da"/></g><rect x="118" y="184" width="248" height="30" rx="3" fill="#ffe9e9" stroke="#d1242f"/><text class="mono" x="132" y="204" font-size="12" fill="#a40e19">active_assignment_count = 2</text></g>
  <g transform="translate(470 156)"><text class="sans label">CONTROLLED SCHEDULE</text><rect y="20" width="242" height="212" rx="5" fill="#eff9f8" stroke="#6fcbc6"/><g transform="translate(22 43)"><rect x="16" width="16" height="16" fill="#0b6e6a"/><rect y="16" width="37" height="16" fill="#0b6e6a"/><rect x="43" y="16" width="37" height="16" fill="#6e8d8a"/><rect y="48" width="16" height="32" fill="#0b6e6a"/><rect x="64" y="48" width="16" height="32" fill="#6e8d8a"/></g><text class="sans" x="120" y="62" font-size="19" font-weight="700" fill="#0d1117">weavegate</text><text class="sans tiny" x="120" y="84">orchestrator</text><path class="control" d="M42 112h150"/><circle cx="60" cy="112" r="8" fill="#0f8b86"/><circle cx="115" cy="112" r="8" fill="#0969da"/><circle cx="170" cy="112" r="8" fill="#0f8b86"/><g class="mono tiny" text-anchor="middle"><text x="60" y="140">A1</text><text x="115" y="140">B1</text><text x="170" y="140">A2</text></g><rect x="24" y="164" width="194" height="28" rx="3" fill="#fff" stroke="#b9c0c8"/><text class="mono" x="39" y="183" font-size="11" fill="#3d4653">sch_7dcb74b1e506</text></g><path class="control" d="M470 257H413"/><path class="flow" d="M712 262h50"/>
  <g transform="translate(762 156)"><text class="sans label">RULE-BASED VERDICT</text><rect y="20" width="396" height="212" rx="3" fill="#0d1117"/><rect y="20" width="4" height="212" fill="#d1242f"/><circle cx="24" cy="39" r="4" fill="#d1242f"/><circle cx="38" cy="39" r="4" fill="#9a6700"/><circle cx="52" cy="39" r="4" fill="#1a7f37"/><text class="mono termFail" x="22" y="78">FAIL  ·  WG001</text><text class="mono term" x="22" y="106">invariant violated under</text><text class="mono term" x="22" y="128">a controlled schedule</text><line x1="22" y1="148" x2="372" y2="148" stroke="#262e39"/><text class="mono termDim" x="22" y="174">assertion</text><text class="mono term" x="118" y="174">active-assignment-is-unique</text><text class="mono termDim" x="22" y="199">evidence</text><text class="mono" x="118" y="199" font-size="12" fill="#3ad0c8">schedule · trace · rows</text></g>
  <g class="sans tiny"><line x1="42" y1="419" x2="72" y2="419" stroke="#0f8b86" stroke-width="3"/><text x="82" y="424">workflow and evidence</text><line x1="244" y1="419" x2="274" y2="419" stroke="#0969da" stroke-width="2" stroke-dasharray="7 6"/><text x="284" y="424">sync-point control</text><text x="1158" y="424" text-anchor="end">Fixtures are data · adapters implement a protocol · oracles compose</text></g>
</svg>
