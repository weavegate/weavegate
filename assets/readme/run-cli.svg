<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">From CLI command to replayable WG001 evidence</title><desc id="desc">A terminal command runs the vulnerable concurrent-assign scenario. weavegate provisions MySQL, explores schedules, reports WG001 with exit code two, and provides the saved schedule ID for replay.</desc>
  <defs><style>.sans{font-family:'IBM Plex Sans',Arial,sans-serif}.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#0b6e6a}.title{font-size:29px;font-weight:700;fill:#0d1117}.label{font-size:12px;font-weight:700;fill:#3d4653}.tiny{font-size:11px;fill:#6e7781}.term{font-size:12px;fill:#e8ebee}.dim{font-size:11px;fill:#8b949e}.fail{font-size:13px;font-weight:700;fill:#ff7b72}.pass{font-size:12px;fill:#3fb950}.accent{font-size:12px;fill:#3ad0c8}.flow{stroke:#0f8b86;stroke-width:3;fill:none;marker-end:url(#ta)}</style><marker id="ta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#0f8b86"/></marker></defs>
  <rect width="1200" height="470" fill="#f8f9fa"/><path d="M0 0h1200v6H0z" fill="#0b6e6a"/><text class="sans eyebrow" x="42" y="42">SERVICE FLOW</text><text class="sans title" x="42" y="78">Run once. Keep the schedule.</text><text class="sans tiny" x="1158" y="76" text-anchor="end">current Go-native reference SUT</text><line x1="42" y1="101" x2="1158" y2="101" stroke="#d8dde2"/>
  <g transform="translate(42 132)"><text class="sans label">01 · COMMAND</text><rect y="20" width="392" height="250" rx="3" fill="#0d1117"/><rect y="20" width="392" height="30" fill="#12181f"/><circle cx="18" cy="35" r="4" fill="#d1242f"/><circle cx="32" cy="35" r="4" fill="#9a6700"/><circle cx="46" cy="35" r="4" fill="#1a7f37"/><text class="mono dim" x="368" y="39" text-anchor="end">bash</text><text class="mono accent" x="20" y="79">$ weavegate run \</text><text class="mono" x="28" y="103" font-size="10.5" fill="#e8ebee">--config fixtures/matching-slice/.weavegate/config.yaml \</text><text class="mono term" x="28" y="127">--scenario concurrent-assign \</text><text class="mono term" x="28" y="151">--variant vulnerable</text><line x1="20" y1="178" x2="372" y2="178" stroke="#262e39"/><text class="mono dim" x="20" y="207">input</text><text class="mono term" x="84" y="207">fixture + scenario + variant</text><text class="mono dim" x="20" y="235">requires</text><text class="mono term" x="84" y="235">Docker · MySQL 8.4</text></g>
  <path class="flow" d="M434 277h66"/>
  <g transform="translate(500 132)"><text class="sans label">02 · CONTROL</text><rect y="20" width="210" height="250" rx="5" fill="#eff9f8" stroke="#6fcbc6"/><text class="sans" x="105" y="63" text-anchor="middle" font-size="16" font-weight="700" fill="#0d1117">Explore schedules</text><g transform="translate(33 90)"><path d="M0 0h144" stroke="#0969da" stroke-width="2" stroke-dasharray="7 6"/><circle r="10" fill="#0f8b86"/><circle cx="48" r="10" fill="#0969da"/><circle cx="96" r="10" fill="#0f8b86"/><circle cx="144" r="10" fill="#0969da"/><g class="mono" font-size="9" fill="#fff" text-anchor="middle"><text y="3">A1</text><text x="48" y="3">B1</text><text x="96" y="3">A2</text><text x="144" y="3">B2</text></g></g><text class="sans tiny" x="105" y="130" text-anchor="middle">sync-point release order</text><rect x="24" y="157" width="162" height="37" rx="3" fill="#fff" stroke="#d8dde2"/><text class="mono" x="105" y="180" text-anchor="middle" font-size="11" fill="#3d4653">real MySQL state</text><text class="sans tiny" x="105" y="224" text-anchor="middle">stop at first violation</text></g>
  <path class="flow" d="M710 277h66"/>
  <g transform="translate(776 132)"><text class="sans label">03 · EVIDENCE</text><rect y="20" width="382" height="250" rx="3" fill="#0d1117"/><rect y="20" width="4" height="250" fill="#d1242f"/><text class="mono fail" x="22" y="61">## weavegate: FAIL (WG001)</text><text class="mono term" x="22" y="88">scenario: concurrent-assign</text><text class="mono term" x="22" y="111">violating: sch_7dcb74b1e506</text><text class="mono pass" x="22" y="134">flaky: false (repeat=20)</text><line x1="22" y1="155" x2="360" y2="155" stroke="#262e39"/><text class="mono fail" x="22" y="181">error[WG001]</text><text class="mono term" x="124" y="181">invariant violated</text><text class="mono dim" x="22" y="208">exit</text><text class="mono term" x="86" y="208">2</text><text class="mono dim" x="22" y="232">artifacts</text><text class="mono accent" x="86" y="232">schedule · trace · report</text><text class="mono dim" x="22" y="254">next</text><text class="mono term" x="86" y="254">replay the saved schedule</text></g>
  <g transform="translate(42 432)"><text class="sans tiny">The terminal content uses the current public command and diagnostic structure; volatile run paths are omitted.</text><text class="sans tiny" x="1116" text-anchor="end">exit 0 PASS · exit 2 FAIL · exit 3 FLAKY</text></g>
</svg>
