name: smoke

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

      - name: Run database fixture tests
        run: >-
          go test ./internal/trace/... ./internal/oracle/...
          ./internal/fixture/... ./internal/scenario/... ./internal/orchestrator/...
          ./internal/syncpoint/... ./internal/sut/...
          ./fixtures/matching-slice/...
          ./cmd/weavegate/... ./internal/config/... ./internal/ci/... ./internal/report/...
          -v -count=1 | tee fixture.log

      - name: Assert the fixture invariant
        run: >-
          grep -F
          'MATCHING_FIXTURE_RESULT request_id=42 project_requests=1 matching_sessions=0 assignments=0 reset=true'
          fixture.log

      - name: Assert the SUT adapter invariants
        run: |
          grep -F 'SUT_ADAPTER_RESULT command=probe workers=2 distinct_connections=2 errors=0 async=true worker_identity=preserved' fixture.log
          grep -F 'SUT_STOP_RESULT active_worker=cancelled result_closed=true in_use=0 stop_idempotent=true' fixture.log
          grep -F 'SUT_WORKER_ID_RESULT duplicate_active=error extra_connection=false reuse_after_terminal=ok' fixture.log

      - name: Assert the sync-point runtime invariants
        run: |
          grep -F 'SYNCPOINT_RUNTIME_RESULT worker=w1 points=2 targeted_release=true terminal=done blocked_arrive_unblocked=true' fixture.log
          grep -F 'SYNCPOINT_PROTOCOL_RESULT duplicate_worker=error unknown_worker=error release_before_arrive=error wrong_point=error duplicate_release=error concurrent_wait=error stale_wait=error' fixture.log
          grep -F 'SYNCPOINT_TIMEOUT_RESULT worker=w2 wait_status=timeout state=db_blocked inference=timeout resumed=arrived terminal=done' fixture.log
          grep -F 'SYNCPOINT_CANCEL_RESULT worker=w1 canceled_arrival=cleared release_after_cancel=error release_wins=nil ghost_arrival=false' fixture.log
          grep -F 'SYNCPOINT_CLOSE_RESULT blocked_arrivers=2 blocked_waiters=1 unblocked=3 close_idempotent=true' fixture.log

      - name: Assert the saved replay invariants
        run: |
          grep -F 'EXHAUSTIVE_STRATEGY_RESULT workers=2 points=2 candidates=6 total_known=true order=canonical per_worker_order=preserved unique_ids=6 saved_schedule_index=2 cap_exceeded=error invalid_scenario=error' fixture.log
          grep -F 'SCHEDULE_WRITE_RESULT id=sch_ba00582f9632 source=committed_fixture bytes=identical trailing_newline=true mode=0644 roundtrip=stable overwrite=ok nil_writer=error tamper=error' fixture.log
          grep -F 'EXPLORE_ENGINE_RESULT candidates=6 total_known=true evaluated=2 violating_index=2 stop_at_first=true resets=2 cleanup=ok run_error=propagated partial_summaries=2 nil_evaluator=error zero_oracles=error empty_sequence=error' fixture.log
          grep -F 'EXPLORE_EXHAUSTED_RESULT candidates=6 evaluated=6 violating=none exhausted=true cleanup=ok' fixture.log
          grep -F 'EXPLORE_UNKNOWN_TOTAL_RESULT total_known=false candidates=0 evaluated=3 violating_index=3 unknown_is_not_zero=true' fixture.log
          grep -F 'SCHEDULE_REPLAY_RESULT id=sch_ba00582f9632 steps=4 workers=2 per_worker_order=valid roundtrip=stable tamper=error' fixture.log
          grep -F 'ORCHESTRATOR_RUN_RESULT schedule=sch_ba00582f9632 workers=2 steps=4 timeouts=1 pending_resolved=1 terminal_done=2 cleanup=ok' fixture.log
          grep -F 'ORCHESTRATOR_REPLAY_CORE_RESULT schedule=sch_ba00582f9632 repeat=20 fingerprints=1 resets=20 flaky=false' fixture.log
          grep -F 'ORCHESTRATOR_ORACLE_RESULT schedule=sch_ba00582f9632 evaluations=20 oracles_per_evaluation=1 terminal_before_evaluation=true fingerprints=1 cleanup=ok flaky=false' fixture.log
          grep -F 'ORCHESTRATOR_CLASSIFY_RESULT timeout=timeout_inferred deadlock=mysql_deadlock_1213 distinct=true wrapped=true' fixture.log

      - name: Assert the SQL Oracle invariants
        run: |
          grep -F 'TRACE_MODEL_RESULT events=3 terminals=2 json=stable orchestrator_aliases=compatible' fixture.log
          grep -F 'ORACLE_SET_RESULT oracles=2 results=2 pass_results=1 violations=2 declaration_order=preserved fingerprint_order=canonical missing_oracle=changes_fingerprint invalid_result=error' fixture.log
          grep -F 'SQL_ASSERT_ORACLE_RESULT id=active-assignment-is-unique expect_rows=0 observed_rows=1 violations=1 evidence_json={"active_assignment_count":2,"project_request_id":42} invalid_utf8=error scan_error=error' fixture.log
          grep -F 'SQL_ASSERT_MYSQL_READONLY_RESULT write=error state_unchanged=true' fixture.log

      - name: Assert the matching assignment invariants
        run: |
          grep -F 'MATCHING_ORACLE_RESULT schedule=sch_ba00582f9632 variant=vulnerable oracle=active-assignment-is-unique count_oracle=matching-workflow-counts oracles_evaluated=2 repeat=20 violation_runs=20 violations=20 evidence_rows=20 evidence_json={"active_assignment_count":2,"project_request_id":42} flaky=false' fixture.log
          grep -F 'MATCHING_ORACLE_RESULT schedule=sch_ba00582f9632 variant=fixed oracle=active-assignment-is-unique count_oracle=matching-workflow-counts oracles_evaluated=2 repeat=20 pass_runs=20 violations=0 evidence_rows=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_RESULT schedule=sch_ba00582f9632 variant=vulnerable repeat=20 duplicate_runs=20 blocked_runs=0 sessions=2 assignments=2 active_assignments=2 worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_RESULT schedule=sch_ba00582f9632 variant=fixed repeat=20 pass_runs=20 blocked_runs=20 lock_wait_runs=20 sessions=1 assignments=1 active_assignments=1 worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -F 'MATCHING_REPLAY_TIMING schedule=sch_ba00582f9632 runs=40 elapsed=' fixture.log

      - name: Assert the matching exploration invariants
        run: |
          grep -E 'MATCHING_EXPLORE_RESULT variant=vulnerable candidates=6 repeats=20 evaluated=[1-9][0-9]* distinct_schedules=1 distinct_indices=1 distinct_fingerprints=1 violating_index=[1-6] schedule=sch_[0-9a-f]{12} saved=reloaded replay_repeat=20 violation_runs=20 fingerprint_match=true worker_errors=0 deadlocks=0 flaky=false' fixture.log
          grep -E 'MATCHING_EXPLORE_CENSUS variant=vulnerable candidates=6 repeats=3 evaluated=18 violating_candidates=[0-6] stable=true' fixture.log
          grep -E 'MATCHING_EXPLORE_RESULT variant=fixed candidates=6 repeats=5 evaluated=30 violating=none exhausted=true pending_resolved_runs=[0-9]+ terminal_skipped_runs=[0-9]+ worker_errors=0 deadlocks=0' fixture.log

      - name: Assert the command-line contract
        run: |
          grep -F 'CONFIG_LOAD_RESULT scenarios=1 workers=2 sync_points=2 assertions=1 repeat=20 arrive_timeout_ms=250 explore_passes=3 defaults=applied relative_paths=resolved unknown_key=error report_section=error missing_required=error non_mysql_db=error path_entrypoint=error bad_expect_rows=error bad_assertion_id=error duplicate_worker=error duplicate_sync_point=error nonpositive_run_value=error explicit_zero_run_value=error worker_args_mismatch=error unsupported_adapter=error' fixture.log
          grep -F 'EXIT_CODE_RESULT pass=0 violation=2 flaky=3 fixture=4 input=5 output=5 unclassified=5 error_beats_verdict=true flaky_beats_violation=true cleanup_on_pass=4 cleanup_keeps_violation=2 cleanup_never_masks=true' fixture.log
          grep -F 'RUN_ARTIFACT_RESULT files=6 dir_mode=0755 file_mode=0644 key_order=canonical empty_slice=json_array trailing_newline=true volatile_files=manifest+report_json deterministic_files=4 rerun_identical=4_of_6 replay_line=self_sufficient config_path=as_given tmp_same_filesystem=true partial_write=cleaned write_failure=output_error' fixture.log
          grep -F 'CLI_ROOT_RESULT version=printed no_args=help exit=0 unknown_command=5 unknown_flag=5 errors=stderr results=stdout usage_dump=suppressed' fixture.log
          grep -F 'CLI_RESOLVE_RESULT entrypoint=matching-slice adapter=gonative variant=vulnerable workers=2 sync_points=2 oracles=1 oracle_order=preserved image=mysql:8.4 block_ms=250 step_ms=5000 run_ms=15000 stop_ms=5000 unknown_entrypoint=5 unknown_variant=5 bad_scenario=5 no_container=true' fixture.log
          grep -F 'CLI_REPORT_RESULT json=byte_identical md=byte_identical default_format=json latest_run=lexicographic_max same_second_ties=ordered missing_run=5 bad_format=5 no_rerender=true' fixture.log
          grep -F 'CLI_VERDICT_RESULT all_violation=2 partial_violation=3 all_pass_after_discovery=3 fingerprint_mismatch=3 replay_mode_flaky=3 exhausted=0' fixture.log
          grep -F 'CLI_REPLAY_COMMAND_RESULT source=report_md executed=verbatim resolved_from=run_directory verdict=identical exit=2' fixture.log
          grep -F 'CLI_RUN_FAILURE_RESULT bad_config=5 missing_scenario=5 unknown_scenario=5 unknown_schedule=5 ambiguous_schedule=5 unwritable_out=5 unreachable_docker=4 artifacts_written_on_pass=true cleanup_failure_on_pass=4' fixture.log
          grep -E 'CLI_RUN_RESULT mode=explore variant=vulnerable passes=1 evaluated=[1-9][0-9]* schedule=sch_[0-9a-f]{12} repeat=20 violation_runs=20 flaky=false artifacts=6 exit=2' fixture.log
          grep -F 'CLI_RUN_RESULT mode=explore variant=fixed passes=3 evaluated=18 violating=none exhausted=true flaky=false artifacts=6 exit=0' fixture.log
          grep -F 'CLI_RUN_RESULT mode=replay variant=vulnerable schedule=sch_ba00582f9632 repeat=20 violation_runs=20 flaky=false artifacts=6 exit=2' fixture.log

      - name: Run the lost-update experiment
        run: go test ./experiments/lost-update/... -v -count=1 | tee lostupdate.log

      - name: Assert the experiment invariants
        run: |
          grep -Eq 'LOSTUPDATE_RESULT path=vulnerable .* lost=[1-9][0-9]*' lostupdate.log
          grep -Eq 'LOSTUPDATE_RESULT path=fixed .* lost=0( |$)' lostupdate.log

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            './**/*.md'
          fail: true

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            './**/*.md'
          fail: true
